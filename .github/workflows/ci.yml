name: CI
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Ticket 03a gates. The null-parser bootstrap itself runs inside `pnpm test`
      # (benchmarks/src/bootstrap.test.ts) against the committed dev fixtures; these are
      # the checks around it that a test alone cannot make.
      - run: pnpm scan:pii
      - run: pnpm verify:results
      # Ticket 09b gates. `verify:accuracy` re-runs the shipped parse() over the committed dev and eval
      # fixtures and requires the bytes of the published accuracy artifacts to come out the same; the
      # fixtures are committed, so this needs no dataset download and no browser. `verify:accuracy-table`
      # regenerates the README block from those artifacts, fails on drift, and discharges gate G8t by
      # comparing each artifact's declared τ, metric, confidence floors and round-off band against
      # benchmark.config *and* against the values DECISIONS/0006, DECISIONS/0011 and ROADMAP G8t declare.
      # The end-to-end measurement is deliberately not run here: it needs the 2.7 GB raw snapshot and
      # Chromium, and its artifact is committed rather than reproduced (DECISIONS/0014 M6).
      - run: pnpm verify:accuracy
      - run: pnpm verify:accuracy-table
      - run: node scripts/check-fixture-budget.mjs
      # Ticket 08 gate. The README footprint table is a pure function of the committed
      # measurement, so regenerating it must be a no-op. The same check re-derives the
      # measured bytes from this tree: it re-stats and re-hashes every committed model
      # asset, re-stats the lockfile-pinned ORT WASM build, and re-hashes the manifest.
      # A swapped model, a lockfile bump or a hand-edited number all fail here.
      # The measurement itself is deliberately NOT run in CI: shared-runner timings would
      # publish a table whose declared device class is "whatever pod hosted the job".
      - run: pnpm verify:footprint
      - run: pnpm exec playwright install --with-deps chromium
      # The @offline suite (ticket 09a) has exactly one owner: .github/workflows/privacy.yml.
      # Running it here too would double the browser OCR cost without adding a guarantee.
      - run: pnpm exec playwright test --config playwright/playwright.config.ts --grep-invert @offline
