name: Privacy

# Ticket 09a: the M1 offline/egress gate. PROJECT(1).md §9 names this workflow and requires it to
# block merges on failure. The runtime test is the proof; the static scan is a labelled supplement.
# The OCR run has exactly one owner here, so ci.yml's e2e step excludes @offline tests.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Static first-party egress scan (supplement, not proof)
        run: pnpm scan:egress
      # Same family, same reason: structural, cheap, and it fails on the commit that introduces the problem
      # rather than on the browser run that might reach it (DECISIONS/0027 W12.1).
      - name: Web Storage single-key rule
        run: pnpm check:storage-keys
      - run: pnpm exec playwright install --with-deps chromium
      - name: Offline inference with egress blocked (M1)
        run: pnpm test:offline
      # Ticket 17 (W8/W9.1): the same M1 suite also carries the service-worker scenarios — install and
      # precache, offline *across a reload*, the offline capture-to-draft flow, the update failure that keeps
      # the previous model set, the /capture-only trigger, and the controller hand-off on a throttled link.
      # They are @offline because they are the privacy claim's stronger form, and they belong here rather
      # than in ci.yml for the same reason ticket 09a's tests do: one owner for the browser OCR cost.
      - name: Service-worker offline reload and self-update (M1, ticket 17)
        run: pnpm exec playwright test --config playwright/playwright.config.ts offline-reload.spec.ts
      # Ticket 18 (§9 M3): the audit the README's local-processing claim rests on. One workflow run, one owner for
      # the browser OCR cost — the tests are tagged @offline so ci.yml's --grep-invert skips them, exactly as it
      # skips ticket 09a's and ticket 17's (DECISIONS/0030 P10).
      - name: Full-workflow PWA privacy audit (M3, ticket 18)
        run: pnpm exec playwright test --config playwright/playwright.config.ts privacy.spec.ts
